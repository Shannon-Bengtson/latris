name: Weekly health check

# The code-quality review that isn't run on every push (scripts/health_report.py): known vulnerabilities
# in the dependencies, risky patterns, complexity, size, duplication, dead code, type errors and the
# ratchet lists, and the whole suite against today's releases of every dependency. The report is the
# run's summary page. A run fails only on a known vulnerability, or a test that fails with today's
# dependencies; then it opens an issue labelled `health-check` (or comments on the open one), and
# closes it once a run passes. Scheduled runs start from the default branch only.
on:
  schedule:
    - cron: "23 19 * * 0"  # Sunday 19:23 UTC: Monday morning in Australia, ready for the week
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: health
  cancel-in-progress: false

jobs:
  report:
    name: health report
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure git identity
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node (for jscpd)
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      # No pip cache: the point is to test against today's releases of every dependency.
      - name: Install latris and the analysis tools
        run: |
          python -m pip install -e ".[server,data,dev]"
          python -m pip install "pip-audit==2.10.1" "bandit==1.9.4" "radon==6.0.1" "vulture==2.16"

      - name: Health report
        id: report
        env:
          LATRIS_AI_MOCK: "1"
        run: |
          python scripts/health_report.py --title "latris health report" --src src/latris \
            --pytest-args "-n auto" \
            --ratchet tests/complexity_exceptions.txt --ratchet tests/type_errors.txt \
            --ratchet tests/server/untested_routes.txt --ratchet worked_example/not_in_worked_example.txt \
            --out health-report.md

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-report
          path: health-report.md
          retention-days: 90

      - name: Open or update the health-check issue
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create health-check --color D93F0B --description "Weekly health check" 2>/dev/null || true
          body="The weekly health check failed: a known vulnerability in a dependency, or a test that fails with today's releases. Report: $RUN_URL"
          number=$(gh issue list --label health-check --state open --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "Weekly health check failed" --label health-check --body "$body"
          fi

      - name: Close the health-check issue
        if: success() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for number in $(gh issue list --label health-check --state open --json number --jq '.[].number'); do
            gh issue close "$number" --comment "Passing again: $RUN_URL"
          done
