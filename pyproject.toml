[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "latris"
dynamic = ["version"]
description = "Latris — an AI-assisted, evidence-native causal-modelling workbench (Python CLI + server backend)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Shannon Bengtson" }]
keywords = [
    "latris",
    "modelling",
    "causal",
    "systems-thinking",
    "cld",
    "bayesian",
    "evidence",
    "provenance",
    "git",
]
urls = { Homepage = "https://latris.app", Repository = "https://github.com/Shannon-Bengtson/latris" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "pydantic>=2.6",
    "typer>=0.26",
    "click>=8.2",
    "rich>=13.7",
    "ruamel.yaml>=0.18",
    "python-ulid>=2.2",
    "litellm>=1.40",
    "instructor>=1.3",
    "keyring>=25",
    "python-docx>=1.1",
    "bibtexparser>=1.4,<2",
    "httpx>=0.28",
    "jinja2>=3.1",
]

[project.optional-dependencies]
data = [
    "pandas>=2.0",
    "scipy>=1.11",
]
# Quantitative modelling backends (probabilistic/numerical inference).
# Heavy and optional — gated behind this extra, never in the core install.
# pgmpy 1.x brings scikit-learn/statsmodels/networkx transitively (no torch).
quant = [
    "pgmpy>=1.1",
]
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "watchfiles>=1.0",
    "pandas>=2.0",
    "scipy>=1.11",
    "python-multipart>=0.0.7",
    # Quantitative inference must be available to the bundled desktop backend.
    "pgmpy>=1.1",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
    "pytest-rerunfailures>=14",
    "ruff>=0.4",
    "build>=1.2",
]

[project.scripts]
latris = "latris.cli.app:app"

[tool.hatch.version]
path = "src/latris/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/latris"]
# Agent-facing instructions belong in the repo/sdist, not the installed package.
exclude = ["**/CLAUDE.md"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/worked_example",
    "/projects",
    "/docs",
    "/scripts",
    "/README.md",
    "/CLAUDE.md",
    "/llms.txt",
    "/CONTRIBUTING.md",
    "/LICENSE",
    "/pyproject.toml",
]
# Demo data lives under gitignore patterns (projects/, sample_data.csv) but
# belongs in the sdist; force-include bypasses ignore rules for these paths.
force-include = { "projects" = "projects" }

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Typer's idiomatic API places typer.Option(...) in defaults — B008 flags this
# as a function-call default, but that's exactly how typer is meant to be used.
"src/latris/cli/*.py" = ["B008"]
# FastAPI uses Query(...) and File(...) in route defaults in the same way.
"src/latris/server/routes/*.py" = ["B008"]
# Tests occasionally hit the line-length ceiling in fixture literals; tolerate.
"tests/**/*.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -n auto"
markers = [
    "slow: marks tests as slow (run with --slow to include)",
]

[tool.coverage.run]
source = ["src/latris"]
branch = true

[tool.coverage.report]
show_missing = true
# Real current coverage is ~76%. The historical 78 was aspirational and never
# actually enforced (the CI coverage gate had never run). The Story test debt is
# now paid (routes/story.py is fully covered); the remaining gap to 78 is broad,
# general coverage (thin server routes: interpret, sync, references, findings,
# watch) and is tracked as a separate push. See docs/engineering/TESTING.md.
fail_under = 74
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
