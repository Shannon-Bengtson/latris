name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Routine push/PR runs a slim matrix (1 job) to save Actions minutes; a
  # manual "Run workflow" (workflow_dispatch) runs the full 3-OS × 2-py matrix
  # when you want full cross-platform coverage before a release.
  setup:
    name: choose matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo 'matrix={"os":["ubuntu-latest","macos-latest","windows-latest"],"python-version":["3.11","3.12"]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"os":["ubuntu-latest"],"python-version":["3.12"]}' >> "$GITHUB_OUTPUT"
          fi

  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python-version }})
    needs: setup
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure git identity
        # The identity guard in operations/commit.py requires these.
        # Tests use env-var overrides via conftest, but init_project itself
        # reads global config first, so wire both.
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
        shell: bash

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with dev + data + server extras
        run: python -m pip install -e ".[server,data,dev]"

      - name: Lint (ruff)
        run: python -m ruff check src tests

      - name: Run tests with coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        # --reruns guards against transient git-under-parallel flakes on the
        # runner (e.g. "unable to create temporary file" during git add).
        run: python -m pytest -n auto --cov --cov-report=term-missing --reruns 2 --reruns-delay 1 -q

      - name: Run tests
        if: matrix.os != 'ubuntu-latest' || matrix.python-version != '3.12'
        run: python -m pytest -n auto --reruns 2 --reruns-delay 1 -q

  worked-example:
    # Acceptance test: runs the full CLI workflow end-to-end and regenerates
    # the transcript. The transcript embeds per-run temp paths and commit
    # SHAs, so this job asserts the run succeeds and the transcript keeps its
    # required sections — byte-freshness of the committed transcript is
    # enforced by convention (regenerate locally and commit, per CLAUDE.md).
    name: worked example (--slow)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure git identity
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
        shell: bash

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with dev + data + server extras
        run: python -m pip install -e ".[server,data,dev]"

      - name: Run worked example
        run: python -m pytest tests/test_worked_example.py --slow -v

  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build
        run: python -m pip install build

      - name: Build
        run: python -m build .
        # No upload-artifact: CI only verifies the package builds. Uploading
        # sdist/wheel to Actions storage on every push burned the quota.
