name: Publish

# Build a release from a v* tag and publish it to PyPI. Cut the tag with
# scripts/bump-version.sh (or by hand), then push it:
#
#   git tag v0.3.1 && git push --tags
#
# Requires the PYPI_API_TOKEN repository secret (created by the repo owner).

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: build + publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      # Allow the pypa publish action to verify the package provenance.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build
        run: python -m pip install build

      - name: Build sdist + wheel
        run: python -m build .

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
